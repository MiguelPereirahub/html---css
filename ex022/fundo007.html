<!DOCTYPE html>
    <html lang="pt-bt">
        <head>
            <style>
                    section#container{
                             position: relative;
                             height: 500px;   
                             background-color: blue;  
                             padding: 10px; 
                              
                    }
                    article#conteudo{
                             height:400px ;
                             background-color: red;    
                             width: 400px; 
                             position: absolute; 
                             left: 50%;
                             top: 50%;
                             transform: translate(-50%, -50%);
                             

                    }


            </style>
            <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>alinhamento vertical</title>
        </head>
    <body>
        <section id="container">
            <article id="conteudo">

            </article>
        </section>
    </body>
</html>
