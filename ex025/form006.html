<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <form action="hello.py" method="post">
        <fieldset>
            <legend></legend>
            <label for="file">
                foto perfil  <input type="file" id="file">


            </label>
        </fieldset>
        <fieldset>
            <legend>cor</legend>
            <p>
                <label for="cor">
                    <input type="color" name="" id="cor">
                </label>
            </p>
        </fieldset>
        <fieldset>
            <legend>sua satisfação</legend>
            <p><label for="sat">
                sua satisfação <input type="range" name="" id="sat" min="1" max="4" value="0">
            </label></p>
        </fieldset>
        <p>
            <input type="submit" value="enviar"><input type="reset" value="resetar">
        </p>
    </form>
</body>
</html>
