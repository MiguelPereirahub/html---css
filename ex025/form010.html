<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario final</title>
</head>
<body>
    <form action="hello.py" method="get">

        <p>
            <label for="ano">em que ano vc naceu?:</label>
            <input type="number" name="" id="ano" min="1900" max="2026" oninput="
            calcIdade()
            ">
        </p>
        <p>
            <label for="idade">sua idade é:</label>
            <output id="ida">0</output>
        </p>
        <p>
            <input type="submit" value="enviar"><input type="reset" value="apagar">
        </p>
    </form>
    
    <script>
        function calcIdade()
        {
            let atual = new Date().getFullYear()
            ida.innerHTML = Number(atual) - Number(ano.value)
        }
    </script>
</body>
</html>
