<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="hello.py">
        <fieldset>
            <legend>Sexo</legend>
                <input type="radio" name="sexo" id="mas" ><label for="mas" value="mas">masculino</label>
                <input type="radio" name="sexo" id="fem"><label for="fem"value="fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos:</legend>
            <input type="checkbox" name="" id="fut"> <label for="fut">Futebol</label>
<br>
            <input type="checkbox" name="" id="jud"> <label for="jud">Judo</label>
<br>
            <input type="checkbox" name="" id="skt"> <label for="skt">Skate</label>
<br>
            <input type="checkbox" name="" id="tdm"> <label for="tdm">Tenis de Mesa</label>
<br>
            <input type="checkbox" name="" id="j-j"> <label for="j-j">Jiu-Jitsu</label>
<br>
            <input type="checkbox" name="" id="qua"> <label for="qua">Queimada</label>
<br>        
            <input type="checkbox" name="" id="bas"> <label for="bas">Baseball</label>

        </fieldset>
<br>
        <input type="submit" value="enviar"><input type="reset" value="resetar">
    </form>
</body>
</html>
