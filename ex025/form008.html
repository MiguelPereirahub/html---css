<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>falando sobre programação real</title>
</head>
<body>
    <form action="">
        <p>
            <label for="num1">
                numero 1:
                <input type="number" name="num1" id="num1" required min="0" max="1000" oninput="soma.innerHTML = Number(num1.value) + Number(num2.value)">
            </label>
            <br>
            <label for="num2">
                numero 2:
                <input type="number" name="num2" id="num2" required min="0" max="1000" oninput="soma.innerHTML = Number(num1.value) + Number(num2.value)">
            </label>
        </p>
        <p>
            <label for="soma">soma:
            </label>
                <output name="soma" id="soma">0</output>
        </p>
        <p>
            <input type="submit" value="enviar"><input type="reset" value="apagar">
        </p>
    </form>
