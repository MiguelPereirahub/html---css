<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
        .dado{
            width: 20%;
        }
        caption{
            border: 1.5px solid black;
            background-color: lightgrey;
            padding: 15px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            font-size :20px ;

        }
        .num{
            text-align: right;
        }
        table{
            width: 500px;
            border-collapse:collapse;

        }
        td, th{
            height: 3px;
            border: 1.5px solid black;
        }
        thead{
            background-color: rgba(79, 77, 77, 0.708);
            color: white;
        }        
        tfoot{
        background-color: rgba(79, 77, 77, 0.708);
        color: white;
        }
        tbody tr:nth-child(2n){
            background-color: lightgrey;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas grandes</title>
</head>
