<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
        caption{
            border: 1px solid black;
            background-color: lightgrey;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
        }
        table{
            text-align: center;
            margin: auto;
            width: 400px;
            border-collapse: collapse;
        }
        tbody > tr:nth-child(2n){
            background-color: lightgrey;
        }
        tr{
            border: 1px solid black;
        }
        td{
            padding:3px;
            border: 1px solid black;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesclagem de celulas</title>
</head>
<body>
    <code>
        <table>
            <caption>mesclagem de celulas</caption>
            <thead>
            </thead>
            <tbody>
        <tr>
        <td>A</td>
        <td colspan="2">B</td>
        <!--<td>C</td>-->
        </tr>
        <tr>
        <td rowspan="3">D</td>
        <td>E</td>
        <td rowspan="2">F</td>
        </tr>
        <tr>
        <!--<td>G</td>-->
        <td>H</td>
        </tr>
        <tr>
        <!--<td>J</td>-->
        <td colspan="2">K</td>
        </tr>
            </tbody>
        </table>
    </code>
</body>
</html>
