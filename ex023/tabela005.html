<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
        .destaque{
            font-weight: bolder;
            color: aliceblue;
            background-color:lightgrey ;
        }
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
            font-variant: small-caps;
            font-weight:bolder ;
            background-color: lightgrey;
            border: 1px solid black;
            color: aliceblue;
        }
        th{
            color: aliceblue;
            border: 1px solid black;
            border-collapse: collapse;
            background-color: lightgrey;
        }
        table{
            border: 1px solid black;
            border-collapse: collapse;
            width: 400px;
            margin: auto;
        }
        td,tr{
            border: 1px solid black;
            border-collapse: collapse;
        }
        .cnome{
            background-color:lightgrey;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colunas agrupadas em colgroup</title>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissão">
        </colgroup>
        <caption>cadastro</caption>
        <tbody>
            <thead>
                <tr>
                    <th scope="col">nome</th>
                    <th scope="col">sexo</th>
                    <th scope="col">idade</th>
                    <th scope="col">profissão</th>
                </tr>
            </thead>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Julio de Andrade</td>
                <td>M</td>
                <td>30</td>
                <td>Desempregado</td>
            </tr>
            <tr>
                <td>Ana Clara</td>
                <td>F</td>
                <td>50</td>
                <td>Empreendedora</td>
            </tr>
            <tr>
                <td>Miguel Ferraz</td>
                <td>M</td>
                <td>45</td>
                <td>Tecnico de TI</td>
            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
