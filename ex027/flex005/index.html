<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
        body{
            height: 100vh;
            width: 100vw;
            padding: 0px;
            margin: 0px;
        }
        .pai{
            justify-content: center;
            align-items: center;
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: red;
        }
        .filho{
            justify-content: center;
            align-items: center;
            display: flex;
            color: white;
            text-align: center;
            border-radius: 50%;
            height: 500px;
            width: 500px;
            background-color: blue;
            overflow: hidden;
        } 
        article{
            border-radius: 5px;
            width: 500px;
            background-color: black;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coisas no centro com flexbox</title>
</head>
<body>
<div class="pai">
    <div class="filho">
        <article>
            <h1>Hello, Word!</h1>
        </article>
    </div>
</div>
</body>
</html>
