<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
            .container{
                flex-flow: row nowrap;
                background-color: blue;
                display: flex;
                padding: 9px;
            }
            .item{
                flex-basis: 100px;
                border: 1px solid red;
                background-color: white;
            }
    </style>
</head>
<body>
    <div class="container">
                <div class="item" style="flex-grow: 6; flex-shrink: 1;" >A</div>
                <div class="item"  style="flex-grow: 2; flex-shrink: 2;">B</div>
                <div class="item" style="flex-grow: 1; flex-shrink: 3;" >C</div>

    </div>
</body>
</html>
