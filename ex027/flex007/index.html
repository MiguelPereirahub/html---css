<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
            .container{
                background-color: blue;
                display: flex;
                flex-flow: row wrap-reverse;
                justify-content: center;
            }
            .item{
                border: 1px solid red ;
                padding: 9px;   
                background-color: white;
            }
    </style>
</head>
<body>
    <div class="container">
                <div class="item" style="order: 6;">a</div>
                <div class="item" style="order: 5;">b</div>
                <div class="item" style="order: 4;">c</div>
                <div class="item">d</div>
                <div class="item" style="order: -4;">e</div>
                <div class="item" style="order: -5;">f</div>
                <div class="item" style="order: -6;">g</div>
    </div>
</body>
</html>
