<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
            .container{
                flex-flow: row nowrap;
                background-color: blue;
                display: flex;
                padding: 9px;
            }
            .item{
                flex-basis: 100px;
                border: 1px solid red;
                background-color: white;
            }
    </style>
</head>
<body>
    <div class="container">
                <div class="item" style="flex: 6 1 100px;" >A</div>
                <div class="item"  style="flex:2 2 100px;">B</div>
                <div class="item" style="flex:1 3 100px;" >C</div> 

    </div>
</body>
</html>
